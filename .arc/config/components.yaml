version: 2
components:
  comp_web_app:
    name: Web App
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: web_ui
    directory: apps/web
    integrations:
    - to: comp_api_service
      interaction: sync
      via: http
      status: planned
      evidence: Web App calls the API directly
      label: HTTPS/JSON
    - to: comp_identity_provider
      interaction: sync
      via: http
      status: planned
      evidence: TESTING-RELEASE-STORY-028
      label: OIDC sign-in
    zone: client
    serves:
    - TESTING-RELEASE-EPIC-003
    - TESTING-RELEASE-EPIC-004
    - TESTING-RELEASE-EPIC-005
    - TESTING-RELEASE-EPIC-006
    - TESTING-RELEASE-EPIC-007
    - TESTING-RELEASE-EPIC-008
    - TESTING-RELEASE-EPIC-009
    - TESTING-RELEASE-EPIC-010
    - TESTING-RELEASE-EPIC-011
    - TESTING-RELEASE-EPIC-012
    - TESTING-RELEASE-STORY-012
    - TESTING-RELEASE-STORY-013
    - TESTING-RELEASE-STORY-046
    - TESTING-RELEASE-STORY-057
    - TESTING-RELEASE-STORY-066
    - TESTING-RELEASE-STORY-073
    rule: The Web App reaches business data only through the API Service and authenticates
      users only through the Identity Provider.
    adr: ADR-0034
    stack:
      choices:
        styling: Tailwind CSS
        language: JavaScript/TypeScript
        framework: React
        package_manager: pnpm
        testing_tool_e2e: Playwright
        testing_tool_unit: vitest
  comp_api_service:
    name: API Service
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: api_service
    directory: services/api
    integrations:
    - to: comp_relational_database
      interaction: sync
      via: postgresql
      status: planned
      evidence: TESTING-RELEASE-EPIC-004
      label: SQL
    - to: comp_object_storage
      interaction: sync
      via: s3
      status: planned
      evidence: TESTING-RELEASE-STORY-017
      label: documents
    - to: comp_job_queue
      interaction: async
      via: sqs
      status: planned
      evidence: TESTING-RELEASE-STORY-018
      label: job payload
    - to: comp_identity_provider
      interaction: sync
      via: http
      status: planned
      evidence: 'Human: accounts are created in the app by HR admins and bulk import;
        API Service and Worker hold Cognito admin rights'
      label: token + user admin
    zone: application
    serves:
    - TESTING-RELEASE-EPIC-003
    - TESTING-RELEASE-EPIC-004
    - TESTING-RELEASE-EPIC-005
    - TESTING-RELEASE-EPIC-006
    - TESTING-RELEASE-EPIC-007
    - TESTING-RELEASE-EPIC-008
    - TESTING-RELEASE-EPIC-009
    - TESTING-RELEASE-EPIC-010
    - TESTING-RELEASE-EPIC-011
    - TESTING-RELEASE-EPIC-012
    - TESTING-RELEASE-STORY-012
    - TESTING-RELEASE-STORY-013
    - TESTING-RELEASE-STORY-046
    - TESTING-RELEASE-STORY-057
    - TESTING-RELEASE-STORY-066
    - TESTING-RELEASE-STORY-073
    rule: Business records and audit logs are written only through the API Service,
      which applies role checks on every request.
    adr: ADR-0035
    stack:
      choices:
        database: PostgreSQL
        language: JavaScript/TypeScript
        framework: NestJS
        package_manager: pnpm
        testing_tool_unit: jest
      notes: styling not applicable — API only; PostgreSQL via TypeORM (pg driver)
  comp_worker:
    name: Worker
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: worker
    directory: services/worker
    integrations:
    - to: comp_job_queue
      interaction: async
      via: sqs
      status: planned
      evidence: TESTING-RELEASE-EPIC-005
      label: job payload
    - to: comp_relational_database
      interaction: sync
      via: postgresql
      status: planned
      evidence: TESTING-RELEASE-STORY-018
      label: SQL
    - to: comp_object_storage
      interaction: sync
      via: s3
      status: planned
      evidence: Worker generates documents
      label: files
    - to: comp_identity_provider
      interaction: sync
      via: http
      status: planned
      evidence: TESTING-RELEASE-STORY-018
      label: user creation
    - to: external:amazon-ses
      interaction: sync
      status: planned
      evidence: 'Human: ''Email provider: Amazon SES'''
    - to: external:chat-notification-webhooks
      interaction: sync
      status: planned
      evidence: 'Keep them: the Worker keeps sending chat webhook notifications alongside
        Amazon SES email.'
    zone: application
    serves:
    - TESTING-RELEASE-EPIC-005
    - TESTING-RELEASE-EPIC-006
    - TESTING-RELEASE-STORY-018
    rule: Background and long-running work runs in the Worker via the Job Queue, never
      inside API request handling.
    adr: ADR-0036
    stack:
      choices:
        language: JavaScript/TypeScript
        package_manager: pnpm
        testing_tool_unit: jest
  comp_relational_database:
    name: Relational Database
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: infrastructure
    zone: data
    serves:
    - TESTING-RELEASE-EPIC-003
    - TESTING-RELEASE-EPIC-004
    - TESTING-RELEASE-EPIC-005
    - TESTING-RELEASE-EPIC-006
    - TESTING-RELEASE-EPIC-007
    - TESTING-RELEASE-EPIC-008
    - TESTING-RELEASE-EPIC-010
    - TESTING-RELEASE-EPIC-011
    rule: Relational business data lives only in the Relational Database, inside us-east-1.
    adr: ADR-0004
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS
  comp_object_storage:
    name: Object Storage
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: infrastructure
    zone: data
    serves:
    - TESTING-RELEASE-STORY-017
    rule: HR documents are stored encrypted in Object Storage and read only through
      the API Service; the database holds metadata only.
    adr: ADR-0019
    stack:
      choices:
        managed_service: Amazon S3
  comp_job_queue:
    name: Job Queue
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: infrastructure
    zone: data
    serves:
    - TESTING-RELEASE-EPIC-005
    - TESTING-RELEASE-EPIC-006
    - TESTING-RELEASE-STORY-018
    rule: The API Service hands background work to the Worker only by enqueuing jobs
      on the Job Queue.
    adr: ADR-0020
    stack:
      choices:
        managed_service: Amazon SQS
  comp_identity_provider:
    name: Identity Provider
    repo_ref: conn-github-d0b0ad3969344e66b41f5ea7bdc29215
    kind: managed_service
    identity:
      provider: cognito
      hosting: managed
      protocols:
      - oidc
      - saml
      mfa: 'off'
      user_store: provider
    zone: external
    serves:
    - TESTING-RELEASE-EPIC-003
    - TESTING-RELEASE-EPIC-009
    - TESTING-RELEASE-STORY-019
    - TESTING-RELEASE-STORY-028
    rule: Authentication uses standard OIDC/SAML only, so the provider can be replaced
      without application code changes.
    adr: ADR-0021
    stack:
      choices:
        managed_service: AWS Cognito (OIDC/SAML)
