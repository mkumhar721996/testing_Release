<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App Shell</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="prototype-utils.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
    }

    .shell {
      display: flex;
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .shell-sidebar {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-4);
      background: var(--color-bg-subtle);
      border-right: 1px solid var(--color-border);
    }

    .shell-brand {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-fg);
    }

    .shell-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .shell-nav-link {
      display: block;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-fg-muted);
      text-decoration: none;
    }

    .shell-nav-link:hover {
      background: var(--color-bg-inset);
    }

    .shell-nav-link[aria-current="page"] {
      background: var(--color-primary-subtle);
      color: var(--color-primary);
    }

    .shell-main {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .shell-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-5);
      border-bottom: 1px solid var(--color-border);
    }

    .shell-topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .shell-menu-btn {
      display: none;
    }

    .shell-content {
      flex: 1 1 auto;
      padding: var(--space-5);
      overflow-y: auto;
    }

    .shell-footer {
      padding: var(--space-3) var(--space-5);
      border-top: 1px solid var(--color-border);
      font-size: var(--font-size-xs);
      color: var(--color-fg-muted);
    }

    @media (max-width: 768px) {
      .shell-sidebar {
        position: fixed;
        inset: 0 25% 0 0;
        z-index: 25;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }

      .shell-sidebar.is-open {
        transform: translateX(0);
      }

      .shell-menu-btn {
        display: inline-flex;
      }
    }
  </style>
</head>
<body>
  <div data-arc-shell class="shell">
    <aside id="primary-nav" class="shell-sidebar">
      <div class="shell-brand">Comp Console</div>
      <nav class="shell-nav">
        <a class="shell-nav-link" data-nav-key="dashboard" href="#">Dashboard</a>
        <a class="shell-nav-link" data-nav-key="records" href="#">Records</a>
        <a class="shell-nav-link" data-nav-key="tasks" href="#">Tasks</a>
        <a class="shell-nav-link" data-nav-key="reports" href="#">Reports</a>
        <a class="shell-nav-link" data-nav-key="audit-log" href="#">Audit Log</a>
        <a class="shell-nav-link" data-nav-key="admin" href="#">Admin</a>
      </nav>
    </aside>

    <div class="shell-main">
      <header class="shell-topbar">
        <button type="button" class="btn btn-icon btn-ghost shell-menu-btn" data-toggle="primary-nav" aria-label="Toggle navigation">
          ☰
        </button>
        <input class="input" type="search" placeholder="Search records, tasks…" aria-label="Search" />
        <div class="shell-topbar-actions">
          <button type="button" class="btn btn-icon btn-ghost" aria-label="Notifications">🔔</button>
          <a class="shell-nav-link" data-nav-key="account" href="#">Account</a>
        </div>
      </header>

      <main class="shell-content">
        <div data-arc-content></div>
      </main>

      <footer class="shell-footer">
        Comp Console — internal use only.
      </footer>
    </div>
  </div>
</body>
</html>
